<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dergi Okuyucu — Crochet Blankets</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background: #111; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 5%; background: #1a1a1a; border-bottom: 1px solid #333; }
        .viewer-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
        .toolbar { display: flex; gap: 1rem; margin-bottom: 1.5rem; background: #222; padding: 0.6rem 1.2rem; border-radius: 30px; align-items: center; }
        .toolbar button, .toolbar span { background: none; border: none; color: #fff; font-size: 0.9rem; cursor: pointer; font-family: inherit; }
        .toolbar button:hover { color: #E5C100; }
        .page-box { background: #fff; width: 100%; max-width: 800px; height: 500px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #111; font-size: 1.5rem; font-family: 'Playfair Display', serif; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        footer { background: #1a1a1a; padding: 1.5rem 5%; display: flex; justify-content: space-between; font-size: 0.85rem; color: #888; border-top: 1px solid #333; }
        footer a { color: #fff; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <span style="font-family:'Playfair Display',serif; font-size:1.2rem;">Create Your Own Crochet Blankets — 4th Edition</span>
        <a href="index.html" style="color:#fff; text-decoration:none; font-size:0.9rem;">✕ Kapat</a>
    </header>

    <div class="viewer-container">
        <div class="toolbar">
            <button onclick="changePage(-1)">❮ Önceki</button>
            <span>Sayfa <strong id="current-page">6</strong> / 112</span>
            <button onclick="changePage(1)">Sonraki ❯</button>
        </div>
        <div class="page-box" id="page-content">
            Sayfa 6: İçindekiler & Desen Listesi
        </div>
    </div>

    <footer>
        <span>Telefonunuzda sağa sola kaydırarak veya ok tuşlarıyla dergi sayfalarını çevirebilirsiniz.</span>
        <a href="index.html">Ana Sayfaya Dön</a>
    </footer>

    <script>
        let page = 6;
        function changePage(dir) {
            page += dir;
            if(page < 1) page = 1;
            if(page > 112) page = 112;
            document.getElementById('current-page').innerText = page;
            document.getElementById('page-content').innerText = `Sayfa ${page}: Crochet Blankets İçerik Akışı`;
        }
    </script>
</body>
</html>
